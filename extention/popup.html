<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Chat Orchestrator</title>
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; width: 340px; margin: 12px; color: #222; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      label { display: block; margin: 8px 0 2px; font-weight: 600; }
      input[type="text"], input[type="password"], input[type="number"] { width: 100%; box-sizing: border-box; padding: 4px 6px; }
      .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
      button { padding: 5px 8px; cursor: pointer; }
      .status { padding: 6px 8px; border-radius: 4px; background: #eee; margin-bottom: 6px; }
      .ok { background: #d9f7d9; }
      .bad { background: #fbdcdc; }
      pre { background: #f5f5f5; padding: 6px; max-height: 180px; overflow: auto; font-size: 11px; white-space: pre-wrap; }
      .kill { margin-top: 8px; padding: 6px 8px; background: #fff4d6; border-radius: 4px; }
      .kill label { display: inline; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Chat Orchestrator Bridge</h1>
    <div id="status" class="status">…</div>
    <div id="info"></div>

    <div class="kill">
      <input type="checkbox" id="enabled" />
      <label for="enabled">Automation enabled (kill switch)</label>
    </div>

    <div class="kill" style="background: #e8f1ff">
      <input type="checkbox" id="autoClose" />
      <label for="autoClose">Auto-close worker windows by themselves (leave OFF so the orchestrator closes them with close_worker)</label>
    </div>

    <div class="kill" style="background: #f1ecff">
      <input type="checkbox" id="useSysPrompt" />
      <label for="useSysPrompt">Send the worker system prompt with each new worker</label>
    </div>

    <div class="row">
      <button id="setOrch">Set this tab as orchestrator</button>
      <button id="diagnose">Diagnose this tab</button>
      <button id="closeAll">Close all workers</button>
    </div>

    <label>Server WebSocket URL</label>
    <input type="text" id="serverUrl" />
    <label>Token</label>
    <input type="password" id="token" />
    <label>Max worker tabs</label>
    <input type="number" id="maxWorkers" min="1" max="10" />
    <label>Max tasks per hour</label>
    <input type="number" id="maxTasksPerHour" min="1" max="500" />
    <label>Task timeout (minutes)</label>
    <input type="number" id="taskTimeoutMin" min="1" max="60" />
    <label>Worker system prompt</label>
    <textarea id="workerSystemPrompt" rows="9" style="width: 100%; box-sizing: border-box; font-size: 11px"></textarea>
    <div class="row">
      <button id="save">Save &amp; reconnect</button>
      <button id="resetPrompt">Reset prompt to default</button>
    </div>

    <pre id="out" hidden></pre>
    <script src="popup.js"></script>
  </body>
</html>
