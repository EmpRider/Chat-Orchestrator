<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Chat Orchestrator Connection</title>
    <style>
      :root { color-scheme: dark; --ink: #e7e8ed; --line: #34353d; --panel: #1a1b21; }
      body { font: 12px/1.45 system-ui,sans-serif; width: 340px; margin: 12px; background: #0d0e12; color: var(--ink); }
      h1 { font-size: 15px; margin: 0 0 8px; }
      label { display: block; margin: 9px 0 3px; font-weight: 600; }
      input { width: 100%; box-sizing: border-box; padding: 7px; background: #121318; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; }
      button { margin-top: 10px; padding: 7px 10px; border-radius: 6px; background: #26354a; border: 1px solid #415879; color: var(--ink); cursor: pointer; }
      .status { padding: 7px; border-radius: 6px; background: var(--panel); margin-bottom: 6px; }
      .ok { background: #173b2d; color: #9de3c3; }
      .bad { background: #44242c; color: #ffc1c9; }
      .hint { color: #a7aab6; margin: 9px 0 0; }
    </style>
  </head>
  <body>
    <h1>Chat Orchestrator Extension</h1>
    <div id="status" class="status">Connecting…</div>
    <div id="info" class="hint"></div>
    <label for="serverUrl">Proxy WebSocket URL</label>
    <input id="serverUrl" type="url" spellcheck="false" autocomplete="off" />
    <label for="token">Extension-only token</label>
    <input id="token" type="password" spellcheck="false" autocomplete="new-password" />
    <button id="save" type="button">Save connection &amp; reconnect</button>
    <p class="hint">All automation limits, worker behavior and system prompts are managed in the Proxy Tool → Extension settings. They sync automatically on connection.</p>
    <script src="popup.js"></script>
  </body>
</html>
